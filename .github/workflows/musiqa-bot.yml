# Musiqa va video yuklovchi Telegram bot — GitHub Actions'da ishlaydi (server kerak emas).
#
# Jadval har 10 daqiqada yangi nusxani ishga tushiradi. Yangisi eski ishlab
# turganda tayyorlanadi (o'rnatish ~40 s), keyin xabarlarni o'zi ola boshlaydi;
# eski nusxa buni sezib (Telegram «Conflict») boshlagan yuklashlarini tugatadi
# va chiqadi. Shunday qilib almashish uzilishsiz bo'ladi. Jadval kechiksa ham
# bitta nusxa 55 daqiqagacha ishlaydi.
# "Run workflow" → rejim "sozlash": buyruqlar va tavsifni bir marta o'rnatadi.
#
# Kerak: Settings → Secrets and variables → Actions →
#   secret   MUSIQA_BOT_TOKEN    — BotFather bergan token (kitob botidan boshqa bot)
#   secret   MUSIQA_COOKIES      — ixtiyoriy: cookies.txt matni (Netscape formatida).
#                                  YouTube «Sign in to confirm you're not a bot» desa
#                                  yoki Instagram yuklamasa, qo'shing.
#
# Eslatma: GitHub jadval bo'yicha ishga tushirishni faqat asosiy (main)
# shoxchadagi workflow uchun qiladi va 60 kun harakat bo'lmasa o'chiradi.

name: Musiqa bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      rejim:
        description: "Nima qilsin"
        type: choice
        options: [xabarlar, sozlash]
        default: xabarlar

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOT_TOKEN: ${{ secrets.MUSIQA_BOT_TOKEN }}
      COOKIES: ${{ secrets.MUSIQA_COOKIES }}
      STATE_FILE: ${{ github.workspace }}/state/musiqa.json
      REJIM: ${{ github.event.inputs.rejim || 'xabarlar' }}
      PYTHONUNBUFFERED: "1"   # jurnal darhol yozilsin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                              # yt-dlp har safar qaytadan yuklanmasin
          cache-dependency-path: musiqa/requirements.txt

      # YouTube uchun yt-dlp'ga JavaScript muhiti (deno) kerak.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ffmpeg: apt orqali har safar ~1,5 daqiqa ketardi — tayyor faylni keshlaymiz.
      - name: ffmpeg keshi
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1

      - name: yt-dlp va ffmpeg
        run: |
          # yt-dlp har doim eng yangisi — saytlar tez-tez o'zgaradi.
          pip install -U "yt-dlp[default]"
          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -sSL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              | tar -xJ -C "$HOME/ffmpeg" --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          "$HOME/ffmpeg/bin/ffmpeg" -version | head -1

      - name: Keshni tiklash
        uses: actions/cache/restore@v4
        with:
          path: state
          key: musiqa-state-${{ github.run_id }}
          restore-keys: musiqa-state-

      - name: Bot
        run: |
          mkdir -p state
          if [ -z "$BOT_TOKEN" ]; then
            echo "::warning::MUSIQA_BOT_TOKEN secret qo'shilmagan — bot ishga tushmadi."
            exit 0
          fi
          if [ -n "$COOKIES" ]; then
            printf '%s\n' "$COOKIES" > "$RUNNER_TEMP/cookies.txt"
            export COOKIES_FILE="$RUNNER_TEMP/cookies.txt"
          fi
          case "$REJIM" in
            sozlash) python3 musiqa/bot.py --setup ;;
            *)       python3 musiqa/bot.py --uzluksiz 55 ;;
          esac

      - name: Keshni saqlash
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: musiqa-state-${{ github.run_id }}
