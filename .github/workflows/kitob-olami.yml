# Kitob olami — Telegram bot GitHub Actions'da ishlaydi (server kerak emas).
#
# Har ishga tushish 50 daqiqa uzluksiz ishlaydi — xabarlarga darhol javob
# beradi va juma aksiyasi eslatmalarini tekshiradi (Toshkent vaqti bilan soat
# 10 dan keyin yuboradi). Jadval har 10 daqiqada navbatdagi ishga tushishni
# tayyorlab qo'yadi: oldingisi tugashi bilan keyingisi boshlanadi. Navbatda
# kutib qolgan eski ishga tushishlar «cancelled» bo'ladi — bu normal holat.
# "Run workflow" → rejim "sozlash": buyruqlar va tavsifni bir marta o'rnatadi.
#
# Kerak: Settings → Secrets and variables → Actions →
#   secret   KITOB_OLAMI_BOT_TOKEN   — BotFather bergan token (AI kursi botidan boshqa bot)
#   variable KITOB_OLAMI_ADMIN_IDS   — do'kon egasining Telegram ID si (botga /men deb yozing)
#   variable KITOB_OLAMI_TOLOV_KARTA — to'lov kartasi (ixtiyoriy, chek so'rash uchun)
#   Mini App uchun: Settings → Pages → Deploy from a branch → main, /docs
#
# Eslatma: GitHub jadval bo'yicha ishga tushirishni faqat asosiy (main)
# shoxchadagi workflow uchun qiladi va 60 kun harakat bo'lmasa o'chiradi.

name: Kitob olami bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      rejim:
        description: "Nima qilsin"
        type: choice
        options: [xabarlar, sozlash]
        default: xabarlar

concurrency:
  group: kitob-olami-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOT_TOKEN: ${{ secrets.KITOB_OLAMI_BOT_TOKEN }}
      ADMIN_IDS: ${{ vars.KITOB_OLAMI_ADMIN_IDS }}
      # Do'kon egasining Telegram username'lari (vergul bilan) — ular ham admin.
      ADMIN_USERNAMES: ${{ vars.KITOB_OLAMI_ADMIN_USERNAMES || 'YULDASHEEVO,Yuldawev0007' }}
      TOLOV_KARTA: ${{ vars.KITOB_OLAMI_TOLOV_KARTA }}
      APP_URL: ${{ vars.KITOB_OLAMI_APP_URL }}
      STATE_FILE: ${{ github.workspace }}/state/kitob.json
      REJIM: ${{ github.event.inputs.rejim || 'xabarlar' }}
      PYTHONUNBUFFERED: "1"   # jurnal darhol yozilsin (to'xtatilganda ham yo'qolmasin)
    steps:
      - uses: actions/checkout@v4

      - name: Mijozlar va aksiyalarni tiklash
        uses: actions/cache/restore@v4
        with:
          path: state
          key: kitob-olami-state-${{ github.run_id }}
          restore-keys: kitob-olami-state-

      - name: Bot
        run: |
          mkdir -p state
          # Mini App: GitHub Pages manzili (Settings → Pages → main /docs).
          # Sahifa ochilmasa, bot tugmani o'zi yashiradi.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          export APP_URL="${APP_URL:-https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/}"
          case "$REJIM" in
            sozlash) python3 kitob/bot.py --setup ;;
            *)       python3 kitob/bot.py --uzluksiz 50 ;;
          esac

      - name: Mijozlar va aksiyalarni saqlash
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: kitob-olami-state-${{ github.run_id }}
