<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitoblar olami</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Ranglar Telegram mavzusidan olinadi; brauzerda ochilsa — o'zimizniki. */
  :root {
    --bg: var(--tg-theme-bg-color, #15121a);
    --bg2: var(--tg-theme-secondary-bg-color, #1f1a24);
    --text: var(--tg-theme-text-color, #f3ead8);
    --hint: var(--tg-theme-hint-color, #a89c88);
    --link: var(--tg-theme-link-color, #e8b560);
    --btn: var(--tg-theme-button-color, #c9953f);
    --btn-text: var(--tg-theme-button-text-color, #1a1208);
    --gold: #e0a84e;
    --green: #3fa66b;
    --red: #d9534f;
    --line: color-mix(in srgb, var(--text) 12%, transparent);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.45;
         font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 26px; margin: 4px 0 2px; }
  h1 em { font-style: normal; color: var(--gold); }
  h2 { font-size: 16px; margin: 22px 0 10px; }
  .muted { color: var(--hint); font-size: 13px; }
  .card { background: var(--bg2); border-radius: 14px; padding: 16px; margin: 12px 0; }
  .brand { letter-spacing: .22em; font-size: 11px; font-weight: 700; color: var(--gold); }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { background: var(--bg2); border-radius: 12px; padding: 12px; }
  .tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--hint); font-size: 12px; }
  .tile.gold b { color: var(--gold); }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row > .grow { flex: 1; min-width: 0; }
  .hbar { margin: 8px 0; }
  .hbar .row { font-size: 13px; margin-bottom: 4px; }
  .price s { color: var(--hint); }
  .price b { font-size: 24px; color: var(--gold); }
  .badge { display: inline-block; background: var(--red); color: #fff; font-size: 12px;
           font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  button, .btn { appearance: none; border: 0; border-radius: 12px; padding: 13px 16px; width: 100%;
                 font: inherit; font-weight: 600; background: var(--btn); color: var(--btn-text);
                 cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--link); border: 1px solid var(--line); }
  .stepper { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .stepper button { width: 44px; height: 44px; padding: 0; font-size: 20px; }
  .stepper b { min-width: 28px; text-align: center; font-size: 20px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 4px; }
  input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--text); font: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { width: auto; padding: 8px 12px; border-radius: 18px; font-weight: 500; font-size: 14px;
          background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  .chip.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .tabs { display: flex; gap: 6px; background: var(--bg2); padding: 4px; border-radius: 12px; margin: 14px 0; }
  .tabs button { background: transparent; color: var(--hint); padding: 9px 4px; font-size: 14px; white-space: nowrap; }
  .tabs button.on { background: var(--bg); color: var(--text); }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .ok { color: var(--green); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--hint); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  svg text { fill: var(--hint); font-size: 10px; }
  .promo + .promo { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main id="app"><p class="muted">Yuklanmoqda…</p></main>

<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const JANRLAR = ["💪 Motivatsion", "🎬 Kino asosidagi kitoblar", "💕 Romanlar",
  "🕌 Diniy va tarixiy", "🧠 Psixologiya", "💼 Biznes", "🧸 Bolalar kitoblari", "📖 Badiiy adabiyot"];
const HAMMA = "📚 Hamma uchun";
const OYLAR = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust",
  "sentabr", "oktabr", "noyabr", "dekabr"];
const BIR_KISHIGA = 5;

// ---- ma'lumot: bot uni havolaning #d=... qismiga joylaydi (serverga ketmaydi)
function oqi() {
  const m = location.hash.match(/d=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try {
    const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  } catch (e) { return null; }
}
const D = oqi();

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const som = n => Math.round(n).toLocaleString("ru-RU").replace(/ |,/g, " ") + " so'm";
const sana = iso => { const d = new Date(iso + "T00:00:00"); return d.getDate() + "-" + OYLAR[d.getMonth()]; };
const kunQoldi = iso => Math.round((new Date(iso + "T00:00:00") - new Date(new Date().toDateString())) / 864e5);
const yarmi = jami => Math.min(jami, Math.ceil(Math.floor(jami / 2) / 1000) * 1000);
const raqam = s => parseInt(String(s).replace(/\D/g, ""), 10) || 0;
const tel = t => t ? "+" + t.replace(/^(\d{3})(\d{2})(\d{3})(\d{2})(\d{2})$/, "$1 $2 $3 $4 $5") : "";

// Menyu tugmasidan ochilgan ilova botga t.me/<bot>?start=<buyruq> orqali «gapiradi»:
// ilova yopiladi, bot chatda davom etadi.
function botga(param) {
  const url = `https://t.me/${(D && D.u) || "My_books_07bot"}?start=${param}`;
  if (tg && tg.openTelegramLink) { tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); tg.openTelegramLink(url); setTimeout(() => tg.close(), 300); }
  else location.href = url;
}
const tasdiq = (matn, ish) => tg && tg.showConfirm ? tg.showConfirm(matn, ok => ok && ish()) : (confirm(matn) && ish());

function gorizontal(qator) {
  if (!qator.length) return `<p class="muted">Hali ma'lumot yo'q.</p>`;
  const maks = Math.max(1, ...qator.map(q => q[1]));
  const jami = qator.reduce((a, q) => a + q[1], 0) || 1;
  return qator.map(([k, v]) => `<div class="hbar"><div class="row"><span class="grow">${esc(k)}</span>
    <span class="muted">${v} · ${Math.round(100 * v / jami)}%</span></div><div class="bar"><i style="width:${100 * v / maks}%"></i></div></div>`).join("");
}

// Haftalik grafik: har hafta uchun ikki ustun (yangi mijozlar va sotuv).
function grafik([mij, sot], w0) {
  const W = 320, H = 150, pad = 18, n = mij.length, g = (W - pad) / n, bw = g * 0.32;
  const maks = Math.max(1, ...mij, ...sot);
  const y = v => H - 20 - (H - 34) * v / maks;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Haftalik grafik">`;
  for (let i = 0; i < n; i++) {
    const x = pad + i * g + g * 0.16;
    const d = new Date(w0 + "T00:00:00"); d.setDate(d.getDate() + 7 * i);
    s += `<rect x="${x}" y="${y(mij[i])}" width="${bw}" height="${H - 20 - y(mij[i])}" rx="2" fill="var(--gold)"><title>${mij[i]} mijoz</title></rect>`;
    s += `<rect x="${x + bw + 2}" y="${y(sot[i])}" width="${bw}" height="${H - 20 - y(sot[i])}" rx="2" fill="var(--green)"><title>${sot[i]} kitob</title></rect>`;
    if (mij[i]) s += `<text x="${x + bw / 2}" y="${y(mij[i]) - 3}" text-anchor="middle">${mij[i]}</text>`;
    s += `<text x="${x + bw}" y="${H - 5}" text-anchor="middle">${d.getDate()}.${String(d.getMonth() + 1).padStart(2, "0")}</text>`;
  }
  return s + `<line x1="${pad}" x2="${W}" y1="${H - 20}" y2="${H - 20}" stroke="var(--line)"/></svg>`;
}

// ================================================================ 🛍 Do'kon (hammaga)
function dokon(el) {
  const p = D.p;                           // [id, sana, kitob, narx, odatiy, qoldi, soni]
  let html = `<p class="muted">${D.n ? "Assalomu alaykum, " + esc(D.n) + "! " : ""}Har juma — bitta kitob aksiya narxida.</p>`;

  if (p) {
    const [id, sn, kitob, narx, odatiy, qoldi, soni] = p;
    const k = kunQoldi(sn);
    const qachon = k === 0 ? "🔥 BUGUN — juma aksiyasi!" : k === 1 ? "⏰ Ertaga — juma aksiyasi!"
      : `📢 ${sana(sn)}, juma — ${k} kun qoldi`;
    const chegirma = odatiy > narx ? Math.round(100 * (odatiy - narx) / odatiy) : 0;
    const tugadi = qoldi === 0;
    html += `
      <div class="card">
        <div class="muted">${qachon}</div>
        <h2 style="margin:6px 0 8px;font-size:20px">📖 ${esc(kitob)}</h2>
        <div class="price">${chegirma ? `<s>${som(odatiy)}</s> ` : ""}<b>${som(narx)}</b>
          ${chegirma ? `<span class="badge">−${chegirma}%</span>` : ""}</div>
        ${soni ? `<div style="margin:14px 0 4px" class="row"><span class="grow muted">Aksiyada ${soni} ta kitob</span>
          <b>${tugadi ? "tugadi" : "qoldi: " + qoldi}</b></div>
          <div class="bar"><i style="width:${Math.max(3, 100 * (soni - Math.max(qoldi, 0)) / soni)}%"></i></div>` : ""}
        ${tugadi ? `<p>😔 Kitob qolmadi — keyingi juma aksiyasida olasiz!</p>` : `
          <div class="stepper"><button id="kam">−</button><b id="soni">1</b><button id="kop">+</button>
            <span class="muted grow" id="hisob"></span></div>
          <button id="bron">📌 Band qilish — yarim pulini to'lab</button>
          ${D.r ? "" : `<p class="muted">Band qilish uchun avval ro'yxatdan o'tasiz (bot so'raydi).</p>`}`}
      </div>`;
  } else {
    html += `<div class="card"><b>📅 Juma aksiyasi</b><p class="muted">Keyingi juma aksiyasi haqida bir hafta oldin xabar beramiz.</p></div>`;
  }

  if (D.b && D.b.length) {
    const H = {k: "⏳ to'lov tekshirilmoqda", t: "✅ band qilindi"};
    html += `<div class="card"><b>📌 Bronlarim</b>${D.b.map(([pid, n, h]) =>
      `<div class="row" style="margin-top:8px"><span class="grow">${n} ta kitob</span><span class="muted">${H[h] || ""}</span></div>`).join("")}</div>`;
  }

  if (!D.r) {
    html += `<div class="card"><b>📝 Ro'yxatdan o'tish</b>
      <p class="muted">Ism, familiya va telefon — 30 soniya. Juma aksiyasini birinchilardan bo'lib bilasiz.</p>
      <button id="royxat">📝 Ro'yxatdan o'tish</button></div>`;
  } else {
    const j = JANRLAR.indexOf(D.q);
    html += `<div class="card"><b>📚 Qaysi kitoblarga qiziqasiz?</b>
      <p class="muted" style="margin:4px 0 10px">Tanlasangiz, shu janrdagi aksiyalarni alohida belgilab yuboramiz.</p>
      <div class="chips" id="janrlar">${JANRLAR.map((x, i) => `<button class="chip ${i === j ? "on" : ""}" data-i="${i}">${esc(x)}</button>`).join("")}</div>
      <label>Yoshingiz</label><input id="yosh" type="number" min="5" max="100" inputmode="numeric" value="${D.y || ""}">
      <div class="err" id="q_xato"></div>
      <button id="q_saqla">✅ Saqlash</button>
      <p class="muted" style="margin-top:10px">Ism yoki telefonni o'zgartirish: <a href="#" id="tahrir" style="color:var(--link)">qayta ro'yxatdan o'tish</a></p></div>`;
  }
  el.innerHTML = html;

  if (p && p[5] !== 0) {
    const narx = p[3], maks = Math.min(BIR_KISHIGA, p[5] < 0 ? BIR_KISHIGA : p[5]);
    let n = 1;
    const yangila = () => {
      $("#soni", el).textContent = n;
      $("#hisob", el).textContent = `Jami ${som(n * narx)} · oldindan ${som(yarmi(n * narx))}`;
    };
    $("#kam", el).onclick = () => { n = Math.max(1, n - 1); yangila(); };
    $("#kop", el).onclick = () => { n = Math.min(maks, n + 1); yangila(); };
    $("#bron", el).onclick = () => botga(`b_${p[0]}_${n}`);
    yangila();
  }
  if (!D.r) { $("#royxat", el).onclick = () => botga("royxat"); return; }

  let janr = JANRLAR.indexOf(D.q);
  $$("#janrlar .chip", el).forEach(b => b.onclick = () => {
    $$("#janrlar .chip", el).forEach(x => x.classList.toggle("on", x === b)); janr = +b.dataset.i;
  });
  $("#tahrir", el).onclick = e => { e.preventDefault(); botga("royxat"); };
  $("#q_saqla", el).onclick = () => {
    const yosh = raqam($("#yosh", el).value);
    const xato = janr < 0 ? "Janrni tanlang." : (yosh < 5 || yosh > 100) ? "Yoshingizni yozing." : "";
    $("#q_xato", el).textContent = xato;
    if (!xato) botga(`q_${janr}_${yosh}`);
  };
}

// ================================================================ 🛠 Admin (faqat do'kon egasiga)
function admin(el) {
  const P = D.pn, [jami, royxat, royxatsiz, bugun, hafta] = D.st;
  el.innerHTML = `
    <p class="muted">Holat: ${sana(P.t)}. Yangilash uchun ilovani yopib, qayta oching.</p>
    <div class="tiles">
      <div class="tile gold"><b>${royxat}</b><span>✅ Ro'yxatdan o'tgan mijozlar</span></div>
      <div class="tile"><b>${royxatsiz}</b><span>⏸ Botga kirgan, o'tmagan</span></div>
      <div class="tile"><b>+${bugun}</b><span>📅 Bugun qo'shildi</span></div>
      <div class="tile"><b>+${hafta}</b><span>🗓 Bu hafta qo'shildi</span></div>
    </div>
    ${P.k ? `<button style="margin-top:10px" id="bronlar">⏳ ${P.k} ta bronning to'lovini tekshirish</button>` : ""}

    <div class="tabs"><button class="on" data-t="mijoz">👥 Mijozlar</button><button data-t="qosh">➕ Aksiya</button><button data-t="royxat">📅 ${P.p.length}</button><button data-t="xabar">✉️</button></div>

    <section data-s="mijoz">
      <input id="izla" placeholder="🔎 Ism yoki telefon bo'yicha qidirish">
      <div class="card" id="mijozlar" style="padding:4px 16px"></div>
      ${royxat > D.c.length ? `<button class="ghost" id="hammasi">👥 Hammasi (${royxat} ta) — chatda</button>` : ""}
    </section>

    <section data-s="qosh" class="hidden"><div class="card">
      <b>📚 Juma aksiyasiga kitob qo'shish</b>
      ${P.f.length ? `
      <label>Qaysi juma?</label>
      <select id="a_sana">${P.f.map(f => `<option value="${f}">${sana(f)}, juma (${kunQoldi(f)} kun)</option>`).join("")}</select>
      <label>Janr</label>
      <select id="a_janr"><option value="">${esc(HAMMA)}</option>${JANRLAR.map((j, i) => `<option value="${i}">${esc(j)}</option>`).join("")}</select>
      <label>Odatiy (do'kondagi) narx</label><input id="a_odatiy" inputmode="numeric" placeholder="400 000">
      <label>Tannarx (mijozlar ko'rmaydi)</label><input id="a_tannarx" inputmode="numeric" placeholder="340 000">
      <label>Aksiya narxi</label><input id="a_narx" inputmode="numeric" placeholder="360 000">
      <p class="muted" id="a_hisob"></p>
      <div class="err" id="a_xato"></div>
      <button id="a_saqla">Davom etish → kitob nomi</button>
      <p class="muted">Keyin bot chatda <b>kitob nomini</b> va <b>muqova rasmini</b> so'raydi. Har aksiyada 100 ta kitob.</p>`
      : `<p class="muted">Kelgusi 8 jumaning hammasiga aksiya qo'yilgan.</p>`}
    </div></section>

    <section data-s="royxat" class="hidden"><div class="card">${P.p.length ? P.p.map(([id, sn, kitob, narx, odatiy, qoldi, soni, tannarx, rasm]) => {
      const band = soni - Math.max(qoldi, 0), k = kunQoldi(sn);
      return `<div class="promo"><div class="row"><b class="grow">📖 ${esc(kitob)}</b><span class="muted">${sana(sn)} · ${k} kun</span></div>
        <div class="muted" style="margin:4px 0 8px">${som(odatiy)} → <b style="color:var(--text)">${som(narx)}</b> · foyda ${som(narx - tannarx)}/dona${rasm ? " · 🖼" : ""}
          · ${k <= 7 ? "mijozlar biladi" : "e'lon " + (k - 7) + " kundan keyin"}</div>
        <div class="row"><div class="bar grow"><i style="width:${soni ? Math.max(2, 100 * band / soni) : 0}%"></i></div><span class="muted">${band}/${soni}</span></div>
        ${band ? "" : `<button class="ghost" style="margin-top:10px" data-ochir="${id}" data-nom="${esc(kitob)}">🗑 O'chirish</button>`}</div>`;
    }).join("") : `<p class="muted">Rejada aksiya yo'q — «➕ Aksiya» ni bosing.</p>`}</div></section>

    <section data-s="xabar" class="hidden"><div class="card">
      <b>✉️ Hamma mijozga xabar</b>
      <p class="muted">Masalan: «Yangi kitoblar keldi! Do'konimizga keling 📚». Tugmani bosing — bot chatda matnni so'raydi.</p>
      <button id="xabar">✍️ Xabar yozish (${royxat} ta mijozga)</button>
    </div></section>`;

  $$(".tabs button", el).forEach(b => b.onclick = () => {
    $$(".tabs button", el).forEach(x => x.classList.toggle("on", x === b));
    $$("section[data-s]", el).forEach(s => s.classList.toggle("hidden", s.dataset.s !== b.dataset.t));
  });

  // --- mijozlar ro'yxati (ism, telefon, yosh, janr, sana)
  const chiz = (f = "") => {
    const q = f.toLowerCase().replace(/\s/g, "");
    const r = D.c.filter(([ism, t]) => !q || (ism + t).toLowerCase().replace(/\s/g, "").includes(q));
    $("#mijozlar", el).innerHTML = r.length ? r.map(([ism, t, yosh, j, kun]) => `
      <div class="promo" style="padding:12px 0"><div class="row"><b class="grow">👤 ${esc(ism)}</b><span class="muted">${esc(kun)}</span></div>
        <div class="row" style="margin-top:4px"><a class="grow" href="tel:+${esc(t)}" style="color:var(--link);text-decoration:none">📱 ${esc(tel(t))}</a>
          <span class="muted">${yosh ? yosh + " yosh" : ""}</span></div>
        ${j >= 0 ? `<div class="muted" style="margin-top:2px">${esc(JANRLAR[j])}</div>` : ""}</div>`).join("")
      : `<p class="muted">${D.c.length ? "Topilmadi." : "Hali hech kim ro'yxatdan o'tmagan."}</p>`;
  };
  chiz();
  $("#izla", el).oninput = e => chiz(e.target.value);
  if ($("#hammasi", el)) $("#hammasi", el).onclick = () => botga("mijozlar");
  if ($("#bronlar", el)) $("#bronlar", el).onclick = () => botga("bronlar");
  $("#xabar", el).onclick = () => botga("xabar");
  $$("[data-ochir]", el).forEach(b => b.onclick = () =>
    tasdiq(`«${b.dataset.nom}» aksiyasini o'chiramizmi?`, () => botga(`o_${b.dataset.ochir}`)));

  if (!P.f.length) return;
  const v = id => raqam($("#" + id, el).value);
  let narxQolda = false;
  $("#a_narx", el).oninput = () => { narxQolda = true; hisobla(); };
  ["a_odatiy", "a_tannarx"].forEach(id => $("#" + id, el).oninput = () => {
    const od = v("a_odatiy"), tn = v("a_tannarx");
    if (!narxQolda && od) $("#a_narx", el).value = Math.max(tn, Math.floor(od * 0.9 / 1000) * 1000) || "";
    hisobla();
  });
  const xato = () => {
    const od = v("a_odatiy"), tn = v("a_tannarx"), nx = v("a_narx");
    if (!od || !tn || !nx) return "Narxlarni to'liq yozing.";
    if (tn >= od) return "Tannarx odatiy narxdan kam bo'lishi kerak.";
    if (nx < tn) return "Aksiya narxi tannarxdan past — zarar bo'ladi.";
    if (nx >= od) return "Aksiya narxi odatiy narxdan arzon bo'lishi kerak.";
    return "";
  };
  function hisobla() {
    const od = v("a_odatiy"), tn = v("a_tannarx"), nx = v("a_narx");
    $("#a_hisob", el).textContent = od && tn && nx && nx >= tn && nx < od
      ? `Chegirma −${Math.round(100 * (od - nx) / od)}% · foyda ${som(nx - tn)}/dona · 100 tasi sotilsa: ${som(100 * (nx - tn))}` : "";
  }
  $("#a_saqla", el).onclick = () => {
    const x = xato();
    $("#a_xato", el).textContent = x;
    const janr = $("#a_janr", el).value;
    if (!x) botga(`a_${$("#a_sana", el).value.replace(/-/g, "")}_${v("a_odatiy")}_${v("a_tannarx")}_${v("a_narx")}${janr ? "_" + janr : ""}`);
  };
}

// ================================================================ 📊 Marketing (faqat do'kon egasiga)
function marketing(el) {
  const M = D.mk, [mij, yangi, bronlar, kutil, sotildi, tushum, foyda, bloklagan, olganlar] = M.s;
  const konv = mij ? Math.round(100 * olganlar / mij) : 0;
  el.innerHTML = `
    <div class="tiles">
      <div class="tile gold"><b>${mij}</b><span>👥 Mijozlar (bu hafta +${yangi})</span></div>
      <div class="tile"><b>${sotildi}</b><span>📚 Sotilgan (band) kitob</span></div>
      <div class="tile"><b>${som(tushum).replace(" so'm", "")}</b><span>💰 Tushum, so'm</span></div>
      <div class="tile"><b>${som(foyda).replace(" so'm", "")}</b><span>📈 Foyda, so'm</span></div>
      <div class="tile"><b>${konv}%</b><span>🎯 Xarid qilganlar (${olganlar} kishi)</span></div>
      <div class="tile"><b>${bloklagan}</b><span>🚫 Botni o'chirganlar</span></div>
    </div>
    <h2>📈 Auditoriya o'sishi (8 hafta)</h2>
    <div class="card">${grafik(M.w, M.w0)}
      <div class="legend"><span><i style="background:var(--gold)"></i>Yangi mijozlar</span><span><i style="background:var(--green)"></i>Sotilgan kitoblar</span></div></div>
    <h2>📚 Mijozlar nimani yoqtiradi</h2>
    <div class="card">${gorizontal(M.g)}</div>
    <h2>🎂 Yosh bo'yicha</h2>
    <div class="card">${gorizontal(["18 gacha", "18–24", "25–34", "35–44", "45+"].map((k, i) => [k, M.y[i]]).filter(q => q[1]))}</div>
    <h2>📅 Aksiyalar natijasi</h2>
    <div class="card">${D.pn.p.length ? D.pn.p.map(([id, sn, kitob, narx, odatiy, qoldi, soni, tannarx]) => {
      const band = soni - Math.max(qoldi, 0);
      return `<div class="promo"><div class="row"><b class="grow">📖 ${esc(kitob)}</b><span class="muted">${sana(sn)}</span></div>
        <div class="muted" style="margin:4px 0 8px">band: ${band} ta · foyda ${som(band * (narx - tannarx))}</div>
        <div class="row"><div class="bar grow"><i style="width:${soni ? Math.max(2, 100 * band / soni) : 0}%"></i></div><span class="muted">${band}/${soni}</span></div></div>`;
    }).join("") : `<p class="muted">Rejada aksiya yo'q.</p>`}</div>`;
}

// ================================================================ sahifa
const app = $("#app");
if (!D) {
  app.innerHTML = `<div class="brand">KITOB OLAMI</div><h1>Kitoblar <em>olamiga</em> xush kelibsiz</h1>
    <p class="muted">Bu ilova Telegram botimiz ichida ochiladi: <a href="https://t.me/My_books_07bot" style="color:var(--link)">@My_books_07bot</a> → pastki chap burchakdagi «📚 Kitoblar» tugmasi.</p>`;
} else {
  app.innerHTML = `<div class="brand">KITOB OLAMI${D.A ? " · DO'KON EGASI" : ""}</div>
    <h1>Kitoblar <em>olamiga</em> xush kelibsiz</h1>
    ${D.A ? `<div class="tabs" id="bosh"><button class="on" data-v="dokon">🛍 Do'kon</button><button data-v="admin">🛠 Admin</button><button data-v="marketing">📊 Marketing</button></div>` : ""}
    <div data-v="dokon"></div>${D.A ? `<div data-v="admin" class="hidden"></div><div data-v="marketing" class="hidden"></div>` : ""}`;
  dokon($('div[data-v="dokon"]'));
  if (D.A) {
    admin($('div[data-v="admin"]'));
    marketing($('div[data-v="marketing"]'));
    let ochiq = null; try { ochiq = sessionStorage.getItem("v"); } catch (e) {}
    $$("#bosh button").forEach(b => b.onclick = () => {
      $$("#bosh button").forEach(x => x.classList.toggle("on", x === b));
      $$("div[data-v]").forEach(d => d.classList.toggle("hidden", d.dataset.v !== b.dataset.v));
      try { sessionStorage.setItem("v", b.dataset.v); } catch (e) {}
    });
    if (ochiq) { const b = $(`#bosh button[data-v="${ochiq}"]`); b && b.click(); }
  }
}
