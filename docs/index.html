<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitoblar olami</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Ranglar Telegram mavzusidan olinadi (yorug'/qorong'i); brauzerda — o'zimizniki. */
  :root {
    --bg: var(--tg-theme-bg-color, #15121a);
    --bg2: var(--tg-theme-secondary-bg-color, #1f1a24);
    --text: var(--tg-theme-text-color, #f3ead8);
    --hint: var(--tg-theme-hint-color, #a89c88);
    --link: var(--tg-theme-link-color, #e8b560);
    --btn: var(--tg-theme-button-color, #c9953f);
    --btn-text: var(--tg-theme-button-text-color, #1a1208);
    --gold: #d99a3e;
    --gold2: #f0c274;
    --green: #3fa66b;
    --red: #e0564f;
    --line: color-mix(in srgb, var(--text) 11%, transparent);
    --card: color-mix(in srgb, var(--bg2) 100%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px 96px; }
  h1 { font-family: var(--serif); font-weight: 900; font-size: 27px; line-height: 1.15; margin: 4px 0 6px; }
  h1 em { font-style: normal; color: var(--gold); }
  h2 { font-size: 16px; margin: 22px 0 10px; }
  .sarlavha { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
              color: var(--hint); margin: 26px 2px 10px; }
  .muted { color: var(--hint); font-size: 13px; }
  .card { background: var(--card); border-radius: 18px; padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
  .brand { letter-spacing: .22em; font-size: 11px; font-weight: 700; color: var(--gold); }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { background: var(--card); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
  .tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--hint); font-size: 12px; }
  .tile.gold b { color: var(--gold); }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 4px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row > .grow, .grow { flex: 1; min-width: 0; }
  .hbar { margin: 8px 0; }
  .hbar .row { font-size: 13px; margin-bottom: 4px; }
  .badge { display: inline-block; background: var(--red); color: #fff; font-size: 12px;
           font-weight: 700; padding: 3px 9px; border-radius: 10px; vertical-align: middle; }
  button, .btn { appearance: none; border: 0; border-radius: 14px; padding: 14px 16px; width: 100%;
                 font: inherit; font-weight: 600; background: var(--btn); color: var(--btn-text);
                 cursor: pointer; transition: transform .08s ease, opacity .15s; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--link); border: 1px solid var(--line); }
  label { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 5px; }
  input, select, textarea { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--text); font: inherit; outline: none; }
  input:focus, select:focus { border-color: var(--gold); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { width: auto; padding: 9px 13px; border-radius: 20px; font-weight: 500; font-size: 14px;
          background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  .chip.on { background: var(--gold); color: #1a1208; border-color: var(--gold); font-weight: 600; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; background: var(--bg2); padding: 4px; border-radius: 14px; margin: 14px 0; }
  .tabs button { background: transparent; color: var(--hint); padding: 9px 6px; font-size: 14px; white-space: nowrap; flex: 1 1 28%; width: auto; }
  .tabs button.on { background: var(--bg); color: var(--text); box-shadow: var(--shadow); }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .ok { color: var(--green); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--hint); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  svg text { fill: var(--hint); font-size: 10px; }
  .promo + .promo { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .hidden { display: none !important; }

  /* ---- mijoz ko'rinishi */
  .hero { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 16/9; box-shadow: var(--shadow);
          background: #15121a url(javon.jpg) center/cover; }
  .salom { font-weight: 600; font-size: 16px; margin: 14px 2px 0; }
  .aksiya { display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: start; }
  .muqova { position: relative; aspect-ratio: 2/3; border-radius: 4px 10px 10px 4px; padding: 32px 10px 10px 16px;
            color: #fbf3e3; font-family: var(--serif); font-weight: 700; font-size: 14px; line-height: 1.2;
            display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
            box-shadow: inset 6px 0 8px rgba(0,0,0,.35), inset -2px 0 2px rgba(255,255,255,.08), 0 10px 22px rgba(0,0,0,.28); }
  .muqova::before { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 2px; background: rgba(240,194,116,.7); }
  .muqova small { font-family: Inter, sans-serif; font-weight: 600; font-size: 9px; letter-spacing: .18em; opacity: .8; }
  .lenta { position: absolute; top: 10px; right: -30px; transform: rotate(35deg); background: var(--red); color: #fff;
           font: 700 11px Inter, sans-serif; padding: 3px 32px; }
  .chip-sana { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; color: var(--gold);
               background: color-mix(in srgb, var(--gold) 14%, transparent); padding: 4px 10px; border-radius: 20px; }
  .kitob-nomi { font-family: var(--serif); font-weight: 700; font-size: 21px; line-height: 1.2; margin: 8px 0 6px; }
  .narx s { color: var(--hint); font-size: 14px; }
  .narx b { display: block; font-size: 26px; color: var(--gold); line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stepper { display: flex; align-items: center; gap: 12px; margin: 14px 0 12px; }
  .stepper button { width: 44px; height: 44px; padding: 0; font-size: 22px; border-radius: 12px;
                    background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  .stepper b { min-width: 28px; text-align: center; font-size: 22px; font-variant-numeric: tabular-nums; }
  .qadamlar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .qadam { background: var(--card); border-radius: 14px; padding: 12px 10px; text-align: center; box-shadow: var(--shadow); }
  .qadam i { font-style: normal; font-size: 24px; display: block; }
  .qadam b { display: block; font-size: 13px; margin-top: 4px; }
  .qadam span { font-size: 11px; color: var(--hint); }
  .holat { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px; white-space: nowrap; }
  .holat.t { color: var(--green); background: color-mix(in srgb, var(--green) 15%, transparent); }
  .holat.k { color: var(--gold); background: color-mix(in srgb, var(--gold) 15%, transparent); }
  .pastki { text-align: center; color: var(--hint); font-size: 12px; margin-top: 28px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<main id="app"><p class="muted">Yuklanmoqda…</p></main>

<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const JANRLAR = ["💪 Motivatsion", "🎬 Kino asosidagi kitoblar", "💕 Romanlar",
  "🕌 Diniy va tarixiy", "🧠 Psixologiya", "💼 Biznes", "🧸 Bolalar kitoblari", "📖 Badiiy adabiyot"];
const HAMMA = "📚 Hamma uchun";
const OYLAR = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust",
  "sentabr", "oktabr", "noyabr", "dekabr"];
const BIR_KISHIGA = 5;

// ---- ma'lumot: bot uni havolaning #d=... qismiga joylaydi (serverga ketmaydi)
function oqi() {
  const m = location.hash.match(/d=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try {
    const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  } catch (e) { return null; }
}
const D = oqi();

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const som = n => Math.round(n).toLocaleString("ru-RU").replace(/ |,/g, " ") + " so'm";
const sana = iso => { const d = new Date(iso + "T00:00:00"); return d.getDate() + "-" + OYLAR[d.getMonth()]; };
const kunQoldi = iso => Math.round((new Date(iso + "T00:00:00") - new Date(new Date().toDateString())) / 864e5);
const yarmi = jami => Math.min(jami, Math.ceil(Math.floor(jami / 2) / 1000) * 1000);
const raqam = s => parseInt(String(s).replace(/\D/g, ""), 10) || 0;
const tel = t => t ? "+" + t.replace(/^(\d{3})(\d{2})(\d{3})(\d{2})(\d{2})$/, "$1 $2 $3 $4 $5") : "";

// Menyu tugmasidan ochilgan ilova botga t.me/<bot>?start=<buyruq> orqali «gapiradi»:
// ilova yopiladi, bot chatda davom etadi.
function botga(param) {
  const url = `https://t.me/${(D && D.u) || "My_books_07bot"}?start=${param}`;
  if (tg && tg.openTelegramLink) { tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); tg.openTelegramLink(url); setTimeout(() => tg.close(), 300); }
  else location.href = url;
}
const tasdiq = (matn, ish) => tg && tg.showConfirm ? tg.showConfirm(matn, ok => ok && ish()) : (confirm(matn) && ish());

function gorizontal(qator) {
  if (!qator.length) return `<p class="muted">Hali ma'lumot yo'q.</p>`;
  const maks = Math.max(1, ...qator.map(q => q[1]));
  const jami = qator.reduce((a, q) => a + q[1], 0) || 1;
  return qator.map(([k, v]) => `<div class="hbar"><div class="row"><span class="grow">${esc(k)}</span>
    <span class="muted">${v} · ${Math.round(100 * v / jami)}%</span></div><div class="bar"><i style="width:${100 * v / maks}%"></i></div></div>`).join("");
}

// Haftalik grafik: har hafta uchun ikki ustun (yangi mijozlar va sotuv).
function grafik([mij, sot], w0) {
  const W = 320, H = 150, pad = 18, n = mij.length, g = (W - pad) / n, bw = g * 0.32;
  const maks = Math.max(1, ...mij, ...sot);
  const y = v => H - 20 - (H - 34) * v / maks;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Haftalik grafik">`;
  for (let i = 0; i < n; i++) {
    const x = pad + i * g + g * 0.16;
    const d = new Date(w0 + "T00:00:00"); d.setDate(d.getDate() + 7 * i);
    s += `<rect x="${x}" y="${y(mij[i])}" width="${bw}" height="${H - 20 - y(mij[i])}" rx="2" fill="var(--gold)"><title>${mij[i]} mijoz</title></rect>`;
    s += `<rect x="${x + bw + 2}" y="${y(sot[i])}" width="${bw}" height="${H - 20 - y(sot[i])}" rx="2" fill="var(--green)"><title>${sot[i]} kitob</title></rect>`;
    if (mij[i]) s += `<text x="${x + bw / 2}" y="${y(mij[i]) - 3}" text-anchor="middle">${mij[i]}</text>`;
    s += `<text x="${x + bw}" y="${H - 5}" text-anchor="middle">${d.getDate()}.${String(d.getMonth() + 1).padStart(2, "0")}</text>`;
  }
  return s + `<line x1="${pad}" x2="${W}" y1="${H - 20}" y2="${H - 20}" stroke="var(--line)"/></svg>`;
}

// ================================================================ 🛍 Do'kon (hammaga)
// Kitob nomidan muqova rangi: har kitobga o'z rangi, lekin doim bir xil.
const MUQOVA = ["#7b1e2b", "#1f4d3a", "#2a3f6b", "#8a5a1f", "#4b2a55", "#23343b", "#8c2f22", "#355e4a"];
const rang = t => MUQOVA[[...t].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % MUQOVA.length];

// Telegram'ning pastdagi katta tugmasi (bo'lmasa — sahifadagi tugma).
const MB = tg && tg.MainButton && tg.platform && tg.platform !== "unknown" ? tg.MainButton : null;
function asosiyTugma(matn, ish) {
  if (!MB) return false;
  MB.setParams({text: matn, color: "#c9953f", text_color: "#1a1208", is_visible: true, is_active: true});
  MB.offClick(asosiyTugma.oldingi || (() => {})); MB.onClick(ish); asosiyTugma.oldingi = ish;
  return true;
}

// Ro'yxat havolasi: r_<telefon>_<janr>_<yosh>_<base64url("ism|familiya")>, 64 belgigacha.
function b64url(str) {
  const bytes = new TextEncoder().encode(str);
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function royxatHavola(ism, fam, tel, janr, yosh) {
  const bosh = `r_${tel}_${janr}_${yosh}_`;
  let nom = `${ism}|${fam}`;
  while (bosh.length + b64url(nom).length > 64 && nom.length > 3) nom = nom.slice(0, -1);
  return bosh + b64url(nom);
}
const telRaqam = t => { let d = String(t).replace(/\D/g, ""); if (d.length === 9) d = "998" + d; return d; };

function royxatForma(yangi) {
  const j = JANRLAR.indexOf(D.q);
  return `
    <label for="r_ism">Ism</label><input id="r_ism" autocomplete="given-name" maxlength="30" value="${esc(D.n || "")}" placeholder="Masalan: Aziz">
    <label for="r_fam">Familiya</label><input id="r_fam" autocomplete="family-name" maxlength="30" value="${esc(D.f || "")}" placeholder="Masalan: Karimov">
    <label for="r_tel">Telefon</label>
    <div class="row"><input id="r_tel" class="grow" type="tel" inputmode="tel" autocomplete="tel" value="${D.t ? "+" + esc(D.t) : ""}" placeholder="+998 90 123 45 67">
      ${tg && tg.requestContact ? `<button class="ghost" id="r_kontakt" style="width:auto;padding:12px">📱</button>` : ""}</div>
    ${tg && tg.requestContact ? `<p class="muted" style="margin:4px 0 0">📱 — Telegram'dagi raqamingizni bir bosishda olish</p>` : ""}
    <label for="r_yosh">Yoshingiz</label><input id="r_yosh" type="number" min="5" max="100" inputmode="numeric" value="${D.y || ""}" placeholder="Masalan: 24">
    <label>Qaysi kitoblarga qiziqasiz?</label>
    <div class="chips" id="r_janr">${JANRLAR.map((x, i) => `<button class="chip ${i === j ? "on" : ""}" data-i="${i}">${esc(x)}</button>`).join("")}</div>
    <div class="err" id="r_xato"></div>
    <button id="r_saqla">${yangi ? "✅ Ro'yxatdan o'tish" : "✅ Saqlash"}</button>`;
}

function royxatUlash(el, yangi) {
  let janr = JANRLAR.indexOf(D.q);
  $$("#r_janr .chip", el).forEach(b => b.onclick = () => {
    $$("#r_janr .chip", el).forEach(x => x.classList.toggle("on", x === b)); janr = +b.dataset.i;
    tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
  });
  if ($("#r_kontakt", el)) $("#r_kontakt", el).onclick = () => tg.requestContact((ok, javob) => {
    const t = ok && javob && javob.responseUnsafe && javob.responseUnsafe.contact && javob.responseUnsafe.contact.phone_number;
    if (t) $("#r_tel", el).value = "+" + telRaqam(t);
  });
  const yubor = () => {
    const v = id => $("#" + id, el).value.trim();
    const tel = telRaqam(v("r_tel")), yosh = raqam(v("r_yosh"));
    const xato = !v("r_ism") ? "Ismingizni yozing." : !v("r_fam") ? "Familiyangizni yozing."
      : (tel.length < 11 || tel.length > 15) ? "Telefon raqamini to'liq yozing." : (yosh < 5 || yosh > 100) ? "Yoshingizni yozing."
      : janr < 0 ? "Qiziqqan kitoblaringizni tanlang." : "";
    $("#r_xato", el).textContent = xato;
    if (xato) { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error"); return; }
    botga(royxatHavola(v("r_ism"), v("r_fam"), tel, janr, yosh));
  };
  $("#r_saqla", el).onclick = yubor;
  return yubor;
}

function dokon(el) {
  const p = D.p;                           // [id, sana, kitob, narx, odatiy, qoldi, soni]
  let html = `<div class="hero" role="img" aria-label="Kitoblar olamiga xush kelibsiz"></div>
    <div class="salom">${D.n ? "Assalomu alaykum, " + esc(D.n) + "! 👋" : "Har juma — bitta kitob aksiya narxida 📚"}</div>`;

  html += `<div class="sarlavha">🔥 Juma aksiyasi</div>`;
  if (p) {
    const [id, sn, kitob, narx, odatiy, qoldi, soni] = p;
    const k = kunQoldi(sn);
    const qachon = k === 0 ? "BUGUN — juma!" : k === 1 ? "Ertaga — juma" : `${sana(sn)}, juma · ${k} kun qoldi`;
    const chegirma = odatiy > narx ? Math.round(100 * (odatiy - narx) / odatiy) : 0;
    const tugadi = qoldi === 0, band = soni - Math.max(qoldi, 0);
    html += `
      <div class="card">
        <div class="aksiya">
          <div class="muqova" style="background:linear-gradient(135deg, ${rang(kitob)}, color-mix(in srgb, ${rang(kitob)} 60%, #000))">
            ${chegirma ? `<span class="lenta">−${chegirma}%</span>` : ""}
            <span>${esc(kitob)}</span><small>KITOB OLAMI</small>
          </div>
          <div>
            <span class="chip-sana">📅 ${qachon}</span>
            <div class="kitob-nomi">${esc(kitob)}</div>
            <div class="narx">${chegirma ? `<s>${som(odatiy)}</s>` : ""}<b>${som(narx)}</b></div>
          </div>
        </div>
        ${soni ? `<div style="margin:16px 0 6px" class="row"><span class="grow muted">${tugadi ? "Hammasi band qilindi" : band ? `${band} ta band qilindi` : "Birinchi bo'lib band qiling!"}</span>
          <b>${tugadi ? "tugadi" : `${qoldi} / ${soni} qoldi`}</b></div>
          <div class="bar"><i style="width:${Math.max(3, 100 * band / soni)}%"></i></div>` : ""}
        ${tugadi ? `<p>😔 Kitob qolmadi — keyingi juma aksiyasida olasiz!</p>` : `
          <div class="stepper"><button id="kam" aria-label="Kamaytirish">−</button><b id="soni">1</b><button id="kop" aria-label="Ko'paytirish">+</button>
            <span class="muted grow" id="hisob"></span></div>
          <button id="bron" ${D.r ? "" : "disabled"}>📌 Band qilish — yarim pulini to'lab</button>
          ${D.r ? "" : `<p class="muted" style="margin:8px 0 0;text-align:center">Band qilish uchun pastda ro'yxatdan o'ting 👇</p>`}`}
      </div>`;
  } else {
    html += `<div class="card row"><span style="font-size:32px">📅</span><div class="grow"><b>Aksiya tez orada</b>
      <div class="muted">Keyingi juma aksiyasi haqida bir hafta oldin xabar beramiz.</div></div></div>`;
  }

  html += `<div class="sarlavha">Qanday ishlaydi</div>
    <div class="qadamlar">
      <div class="qadam"><i>📌</i><b>Band qiling</b><span>kitob sonini tanlab</span></div>
      <div class="qadam"><i>💳</i><b>Yarmini to'lang</b><span>chek rasmini yuboring</span></div>
      <div class="qadam"><i>📚</i><b>Juma kuni oling</b><span>qolganini to'lab</span></div>
    </div>`;

  if (D.b && D.b.length) {
    html += `<div class="sarlavha">📌 Bronlarim</div><div class="card" style="padding:6px 16px">${D.b.map(([pid, n, h]) =>
      `<div class="promo row" style="padding:10px 0"><span class="grow">📖 ${n} ta kitob</span>
        <span class="holat ${h}">${h === "t" ? "✅ band qilindi" : "⏳ tekshirilmoqda"}</span></div>`).join("")}</div>`;
  }

  if (!D.r) {
    html += `<div class="sarlavha">📝 Ro'yxatdan o'tish</div>
      <div class="card" id="royxat"><b>30 soniya — va juma aksiyasini birinchi bo'lib bilasiz</b>${royxatForma(true)}</div>`;
  } else {
    const j = JANRLAR.indexOf(D.q);
    html += `<div class="sarlavha">📚 Qiziqishlarim</div>
      <div class="card">
      <p class="muted" style="margin:0 0 10px">Qaysi kitoblarni yoqtirasiz? Shu janrdagi aksiyalarni alohida belgilab yuboramiz.</p>
      <div class="chips" id="janrlar">${JANRLAR.map((x, i) => `<button class="chip ${i === j ? "on" : ""}" data-i="${i}">${esc(x)}</button>`).join("")}</div>
      <label for="yosh">Yoshingiz</label><input id="yosh" type="number" min="5" max="100" inputmode="numeric" value="${D.y || ""}" placeholder="Masalan: 24">
      <div class="err" id="q_xato"></div>
      <button id="q_saqla">✅ Saqlash</button></div>
      <div class="sarlavha">👤 Ma'lumotlarim</div>
      <div class="card"><div class="row"><div class="grow"><b>${esc(D.n)} ${esc(D.f || "")}</b>
        <div class="muted">${D.t ? "📱 " + esc(tel(D.t)) : ""}</div></div>
        <button class="ghost" id="tahrir" style="width:auto;padding:9px 14px">✏️ O'zgartirish</button></div>
        <div id="royxat" class="hidden" style="margin-top:6px">${royxatForma(false)}</div></div>`;
  }
  html += `<div class="pastki">📚 Kitob olami · @${esc(D.u || "My_books_07bot")}</div>`;
  el.innerHTML = html;

  if (p && p[5] !== 0) {
    const narx = p[3], maks = Math.min(BIR_KISHIGA, p[5] < 0 ? BIR_KISHIGA : p[5]);
    let n = 1;
    const bron = () => botga(`b_${p[0]}_${n}`);
    const yangila = () => {
      $("#soni", el).textContent = n;
      $("#hisob", el).textContent = `Jami ${som(n * narx)} · oldindan ${som(yarmi(n * narx))}`;
      if (D.r && asosiyTugma(`📌 ${n} ta kitobni band qilish`, bron)) $("#bron", el).classList.add("hidden");
    };
    $("#kam", el).onclick = () => { n = Math.max(1, n - 1); yangila(); tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); };
    $("#kop", el).onclick = () => { n = Math.min(maks, n + 1); yangila(); tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); };
    $("#bron", el).onclick = bron;
    yangila();
  }
  const royxatYubor = royxatUlash(el, !D.r);
  if (!D.r) {                                   // yangi odam: asosiy tugma — ro'yxat
    asosiyTugma("✅ Ro'yxatdan o'tish", royxatYubor) && $("#r_saqla", el).classList.add("hidden");
    return;
  }
  $("#tahrir", el).onclick = () => { $("#royxat", el).classList.toggle("hidden"); $("#r_ism", el).focus(); };

  let janr = JANRLAR.indexOf(D.q);
  $$("#janrlar .chip", el).forEach(b => b.onclick = () => {
    $$("#janrlar .chip", el).forEach(x => x.classList.toggle("on", x === b)); janr = +b.dataset.i;
    tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
  });
  $("#q_saqla", el).onclick = () => {
    const yosh = raqam($("#yosh", el).value);
    const xato = janr < 0 ? "Janrni tanlang." : (yosh < 5 || yosh > 100) ? "Yoshingizni yozing." : "";
    $("#q_xato", el).textContent = xato;
    if (!xato) botga(`q_${janr}_${yosh}`);
  };
}

// ================================================================ 🛠 Admin (faqat do'kon egasiga)
function admin(el) {
  const P = D.pn, [jami, royxat, royxatsiz, bugun, hafta] = D.st;
  el.innerHTML = `
    <p class="muted">Holat: ${sana(P.t)}. Yangilash uchun ilovani yopib, qayta oching.</p>
    <div class="tiles">
      <div class="tile gold"><b>${royxat}</b><span>✅ Ro'yxatdan o'tgan mijozlar</span></div>
      <div class="tile"><b>${royxatsiz}</b><span>⏸ Botga kirgan, o'tmagan</span></div>
      <div class="tile"><b>+${bugun}</b><span>📅 Bugun qo'shildi</span></div>
      <div class="tile"><b>+${hafta}</b><span>🗓 Bu hafta qo'shildi</span></div>
    </div>
    ${P.k ? `<button style="margin-top:10px" id="bronlar">⏳ ${P.k} ta bronning to'lovini tekshirish</button>` : ""}

    <div class="tabs"><button class="on" data-t="mijoz">👥 Mijozlar</button><button data-t="qosh">➕ Aksiya</button><button data-t="royxat">📅 Aksiyalar ${P.p.length}</button><button data-t="marketing">📊 Marketing</button><button data-t="xabar">✉️ Xabar</button></div>

    <section data-s="mijoz">
      <input id="izla" placeholder="🔎 Ism yoki telefon bo'yicha qidirish">
      <div class="card" id="mijozlar" style="padding:4px 16px"></div>
      ${royxat > D.c.length ? `<button class="ghost" id="hammasi">👥 Hammasi (${royxat} ta) — chatda</button>` : ""}
    </section>

    <section data-s="qosh" class="hidden"><div class="card">
      <b>📚 Juma aksiyasiga kitob qo'shish</b>
      ${P.f.length ? `
      <label>Qaysi juma?</label>
      <select id="a_sana">${P.f.map(f => `<option value="${f}">${sana(f)}, juma (${kunQoldi(f)} kun)</option>`).join("")}</select>
      <label>Janr</label>
      <select id="a_janr"><option value="">${esc(HAMMA)}</option>${JANRLAR.map((j, i) => `<option value="${i}">${esc(j)}</option>`).join("")}</select>
      <label>Odatiy (do'kondagi) narx</label><input id="a_odatiy" inputmode="numeric" placeholder="400 000">
      <label>Tannarx (mijozlar ko'rmaydi)</label><input id="a_tannarx" inputmode="numeric" placeholder="340 000">
      <label>Aksiya narxi</label><input id="a_narx" inputmode="numeric" placeholder="360 000">
      <p class="muted" id="a_hisob"></p>
      <div class="err" id="a_xato"></div>
      <button id="a_saqla">Davom etish → kitob nomi</button>
      <p class="muted">Keyin bot chatda <b>kitob nomini</b> va <b>muqova rasmini</b> so'raydi. Har aksiyada 100 ta kitob.</p>`
      : `<p class="muted">Kelgusi 8 jumaning hammasiga aksiya qo'yilgan.</p>`}
    </div></section>

    <section data-s="royxat" class="hidden"><div class="card">${P.p.length ? P.p.map(([id, sn, kitob, narx, odatiy, qoldi, soni, tannarx, rasm]) => {
      const band = soni - Math.max(qoldi, 0), k = kunQoldi(sn);
      return `<div class="promo"><div class="row"><b class="grow">📖 ${esc(kitob)}</b><span class="muted">${sana(sn)} · ${k} kun</span></div>
        <div class="muted" style="margin:4px 0 8px">${som(odatiy)} → <b style="color:var(--text)">${som(narx)}</b> · foyda ${som(narx - tannarx)}/dona${rasm ? " · 🖼" : ""}
          · ${k <= 7 ? "mijozlar biladi" : "e'lon " + (k - 7) + " kundan keyin"}</div>
        <div class="row"><div class="bar grow"><i style="width:${soni ? Math.max(2, 100 * band / soni) : 0}%"></i></div><span class="muted">${band}/${soni}</span></div>
        ${band ? "" : `<button class="ghost" style="margin-top:10px" data-ochir="${id}" data-nom="${esc(kitob)}">🗑 O'chirish</button>`}</div>`;
    }).join("") : `<p class="muted">Rejada aksiya yo'q — «➕ Aksiya» ni bosing.</p>`}</div></section>

    <section data-s="marketing" class="hidden"></section>

    <section data-s="xabar" class="hidden"><div class="card">
      <b>✉️ Hamma mijozga xabar</b>
      <p class="muted">Masalan: «Yangi kitoblar keldi! Do'konimizga keling 📚». Tugmani bosing — bot chatda matnni so'raydi.</p>
      <button id="xabar">✍️ Xabar yozish (${royxat} ta mijozga)</button>
    </div></section>`;

  $$(".tabs button", el).forEach(b => b.onclick = () => {
    $$(".tabs button", el).forEach(x => x.classList.toggle("on", x === b));
    $$("section[data-s]", el).forEach(s => s.classList.toggle("hidden", s.dataset.s !== b.dataset.t));
  });
  marketing($('section[data-s="marketing"]', el));

  // --- mijozlar ro'yxati (ism, telefon, yosh, janr, sana)
  const chiz = (f = "") => {
    const q = f.toLowerCase().replace(/\s/g, "");
    const r = D.c.filter(([ism, t]) => !q || (ism + t).toLowerCase().replace(/\s/g, "").includes(q));
    $("#mijozlar", el).innerHTML = r.length ? r.map(([ism, t, yosh, j, kun]) => `
      <div class="promo" style="padding:12px 0"><div class="row"><b class="grow">👤 ${esc(ism)}</b><span class="muted">${esc(kun)}</span></div>
        <div class="row" style="margin-top:4px"><a class="grow" href="tel:+${esc(t)}" style="color:var(--link);text-decoration:none">📱 ${esc(tel(t))}</a>
          <span class="muted">${yosh ? yosh + " yosh" : ""}</span></div>
        ${j >= 0 ? `<div class="muted" style="margin-top:2px">${esc(JANRLAR[j])}</div>` : ""}</div>`).join("")
      : `<p class="muted">${D.c.length ? "Topilmadi." : "Hali hech kim ro'yxatdan o'tmagan."}</p>`;
  };
  chiz();
  $("#izla", el).oninput = e => chiz(e.target.value);
  if ($("#hammasi", el)) $("#hammasi", el).onclick = () => botga("mijozlar");
  if ($("#bronlar", el)) $("#bronlar", el).onclick = () => botga("bronlar");
  $("#xabar", el).onclick = () => botga("xabar");
  $$("[data-ochir]", el).forEach(b => b.onclick = () =>
    tasdiq(`«${b.dataset.nom}» aksiyasini o'chiramizmi?`, () => botga(`o_${b.dataset.ochir}`)));

  if (!P.f.length) return;
  const v = id => raqam($("#" + id, el).value);
  let narxQolda = false;
  $("#a_narx", el).oninput = () => { narxQolda = true; hisobla(); };
  ["a_odatiy", "a_tannarx"].forEach(id => $("#" + id, el).oninput = () => {
    const od = v("a_odatiy"), tn = v("a_tannarx");
    if (!narxQolda && od) $("#a_narx", el).value = Math.max(tn, Math.floor(od * 0.9 / 1000) * 1000) || "";
    hisobla();
  });
  const xato = () => {
    const od = v("a_odatiy"), tn = v("a_tannarx"), nx = v("a_narx");
    if (!od || !tn || !nx) return "Narxlarni to'liq yozing.";
    if (tn >= od) return "Tannarx odatiy narxdan kam bo'lishi kerak.";
    if (nx < tn) return "Aksiya narxi tannarxdan past — zarar bo'ladi.";
    if (nx >= od) return "Aksiya narxi odatiy narxdan arzon bo'lishi kerak.";
    return "";
  };
  function hisobla() {
    const od = v("a_odatiy"), tn = v("a_tannarx"), nx = v("a_narx");
    $("#a_hisob", el).textContent = od && tn && nx && nx >= tn && nx < od
      ? `Chegirma −${Math.round(100 * (od - nx) / od)}% · foyda ${som(nx - tn)}/dona · 100 tasi sotilsa: ${som(100 * (nx - tn))}` : "";
  }
  $("#a_saqla", el).onclick = () => {
    const x = xato();
    $("#a_xato", el).textContent = x;
    const janr = $("#a_janr", el).value;
    if (!x) botga(`a_${$("#a_sana", el).value.replace(/-/g, "")}_${v("a_odatiy")}_${v("a_tannarx")}_${v("a_narx")}${janr ? "_" + janr : ""}`);
  };
}

// ================================================================ 📊 Marketing (faqat do'kon egasiga)
function marketing(el) {
  const M = D.mk, [mij, yangi, bronlar, kutil, sotildi, tushum, foyda, bloklagan, olganlar] = M.s;
  const konv = mij ? Math.round(100 * olganlar / mij) : 0;
  el.innerHTML = `
    <div class="tiles">
      <div class="tile gold"><b>${mij}</b><span>👥 Mijozlar (bu hafta +${yangi})</span></div>
      <div class="tile"><b>${sotildi}</b><span>📚 Sotilgan (band) kitob</span></div>
      <div class="tile"><b>${som(tushum).replace(" so'm", "")}</b><span>💰 Tushum, so'm</span></div>
      <div class="tile"><b>${som(foyda).replace(" so'm", "")}</b><span>📈 Foyda, so'm</span></div>
      <div class="tile"><b>${konv}%</b><span>🎯 Xarid qilganlar (${olganlar} kishi)</span></div>
      <div class="tile"><b>${bloklagan}</b><span>🚫 Botni o'chirganlar</span></div>
    </div>
    <h2>📈 Auditoriya o'sishi (8 hafta)</h2>
    <div class="card">${grafik(M.w, M.w0)}
      <div class="legend"><span><i style="background:var(--gold)"></i>Yangi mijozlar</span><span><i style="background:var(--green)"></i>Sotilgan kitoblar</span></div></div>
    <h2>📚 Mijozlar nimani yoqtiradi</h2>
    <div class="card">${gorizontal(M.g)}</div>
    <h2>🎂 Yosh bo'yicha</h2>
    <div class="card">${gorizontal(["18 gacha", "18–24", "25–34", "35–44", "45+"].map((k, i) => [k, M.y[i]]).filter(q => q[1]))}</div>
    <h2>📅 Aksiyalar natijasi</h2>
    <div class="card">${D.pn.p.length ? D.pn.p.map(([id, sn, kitob, narx, odatiy, qoldi, soni, tannarx]) => {
      const band = soni - Math.max(qoldi, 0);
      return `<div class="promo"><div class="row"><b class="grow">📖 ${esc(kitob)}</b><span class="muted">${sana(sn)}</span></div>
        <div class="muted" style="margin:4px 0 8px">band: ${band} ta · foyda ${som(band * (narx - tannarx))}</div>
        <div class="row"><div class="bar grow"><i style="width:${soni ? Math.max(2, 100 * band / soni) : 0}%"></i></div><span class="muted">${band}/${soni}</span></div></div>`;
    }).join("") : `<p class="muted">Rejada aksiya yo'q.</p>`}</div>`;
}

// ================================================================ sahifa
const app = $("#app");
if (!D) {
  app.innerHTML = `<div class="brand">KITOB OLAMI</div><h1>Kitoblar <em>olamiga</em> xush kelibsiz</h1>
    <p class="muted">Bu ilova Telegram botimiz ichida ochiladi: <a href="https://t.me/My_books_07bot" style="color:var(--link)">@My_books_07bot</a> → pastki chap burchakdagi «📚 Kitoblar» tugmasi.</p>`;
} else if (D.A) {
  // /admin — faqat do'kon egasi uchun: admin ishlari va marketing.
  app.innerHTML = `<div class="brand">KITOB OLAMI · DO'KON EGASI</div><h1>🛠 Admin <em>panel</em></h1><div id="admin"></div>`;
  admin($("#admin"));
} else {
  // Mijoz ko'rinishi (do'kon egasi /mijoz yozganda ham xuddi shunday).
  app.innerHTML = `<div id="dokon"></div>`;
  dokon($("#dokon"));
}
</script>
</body>
</html>
